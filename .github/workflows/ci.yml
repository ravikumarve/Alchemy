name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Static type checking
        run: |
          for f in src/pipeline/*.py src/agents/*.py src/api/main.py; do
            python -m mypy "$f" --ignore-missing-imports --explicit-package-bases
          done

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=term --cov-report=xml -W ignore::DeprecationWarning

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 isort black

      - name: Check formatting (black)
        run: python -m black --check src/ tests/

      - name: Check import order (isort)
        run: python -m isort --check-only src/ tests/

  # Optional: skip if no UI changes
  dashboard:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: false  # Disabled until dashboard is ready for build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
